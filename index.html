        // ==================== 渲染函数 ====================
        function renderOverview() {
            renderOverviewFeed();
        }

        // ==================== 原创志混合信息流引擎（文章 / 动态交替出现） ====================
        const MIXED_FEED_INITIAL_BLOCKS = 3;   // 首屏展示的内容块数（每块 = 一组文章 或 一行动态）
        const MIXED_FEED_STEP_BLOCKS = 2;      // 每次触底加载追加的块数
        const MIXED_FEED_ARTICLE_ROW = 2;      // 文章每次两篇（一篇一行）
        const MIXED_FEED_DYNAMIC_ROW = 3;      // 动态每次三条（三条一行，不足留白）

        let overviewFeedSeed = Math.floor(Math.random() * 1e9);
        let overviewFeedPlan = null;
        let overviewFeedVisibleBlocks = MIXED_FEED_INITIAL_BLOCKS;
        let overviewFeedRenderedBlocks = 0;

        function createSeededRandom(seed) {
            let value = seed >>> 0;
            return function () {
                value = (value + 0x6D2B79F5) >>> 0;
                let t = value;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        function shuffleWithRandom(list, random) {
            const result = list.slice();
            for (let i = result.length - 1; i > 0; i -= 1) {
                const j = Math.floor(random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
        }

        // 把队列切成“行”：动态每次 3 条一行（不足 3 条留白），文章每次 2 篇（一篇一行，不足 2 篇时只放 1 篇）
        function splitIntoRows(queue, maxSize) {
            const rows = [];
            if (!queue.length) return rows;
            for (let i = 0; i < queue.length; i += maxSize) rows.push(queue.slice(i, i + maxSize));
            return rows;
        }

        function buildOverviewFeedPlan(articles, dynamics, signature) {
            const random = createSeededRandom(overviewFeedSeed);
            const articleRows = splitIntoRows(shuffleWithRandom(articles, random), MIXED_FEED_ARTICLE_ROW);
            const dynamicRows = splitIntoRows(shuffleWithRandom(dynamics, random), MIXED_FEED_DYNAMIC_ROW);
            const blocks = [];
            let articleIndex = 0;
            let dynamicIndex = 0;
            let lastType = '';
            // 文章与动态严格交替：文章块 → 动态块 → 文章块 → 动态块……同类不连续出现
            while (articleIndex < articleRows.length || dynamicIndex < dynamicRows.length) {
                let type;
                if (articleIndex >= articleRows.length) type = 'dynamic';
                else if (dynamicIndex >= dynamicRows.length) type = 'article';
                else type = lastType === 'article' ? 'dynamic' : 'article';
                if (type === 'article') {
                    blocks.push({ type: 'article', items: articleRows[articleIndex] });
                    articleIndex += 1;
                } else {
                    blocks.push({ type: 'dynamic', items: dynamicRows[dynamicIndex] });
                    dynamicIndex += 1;
                }
                lastType = type;
            }
            return {
                signature,
                blocks,
                total: articles.length + dynamics.length,
                articleTotal: articles.length,
                dynamicTotal: dynamics.length
            };
        }

        function renderFeedBlock(block, items, animationClass) {
            if (!items.length) return '';
            if (block.type === 'article') {
                return `<section class="feed-block ${animationClass}">${items.map(renderArticleCard).join('')}</section>`;
            }
            return `<section class="feed-block ${animationClass}"><div class="dynamic-row">${items.map(renderDynamicCard).join('')}</div></section>`;
        }

        // 分类菜单（原“原创志”分类功能，收进圆形按钮的下拉里）
        const OVERVIEW_FILTERS = [
            { value: 'all', label: '全部' },
            { value: 'article', label: '文章' },
            { value: 'dynamic', label: '动态' }
        ];

        function renderOverviewFilterButtons() {
            return OVERVIEW_FILTERS.map(item => `<button class="forum-tab-btn ${currentPostSubcat === item.value ? 'active' : ''}" type="button" data-subcat="${item.value}" onclick="filterOverviewFeed('${item.value}', this)">${item.label}</button>`).join('');
        }

        // 同步悬浮分类按钮的下拉选项、选中态与提示
        function renderOverviewFilterMenu() {
            const menu = document.getElementById('overviewFilterMenu');
            if (menu) menu.innerHTML = renderOverviewFilterButtons();
            const button = document.getElementById('overviewFilterBtn');
            if (!button) return;
            const current = OVERVIEW_FILTERS.find(item => item.value === currentPostSubcat) || OVERVIEW_FILTERS[0];
            button.classList.toggle('is-filtered', currentPostSubcat !== 'all');
            button.title = `内容分类：${current.label}`;
            button.setAttribute('aria-label', `内容分类筛选（当前：${current.label}）`);
        }

        function filterOverviewFeed(subcat, btn) {
            currentPostSubcat = subcat;
            closeFilterMenus();
            renderOverviewFeed();
        }

        function renderOverviewFeed() {
            const container = document.getElementById('overviewFeed');
            if (!container) return;
            const searched = postsData.filter(post => matchesSearchTitle(post.title) && (currentPostSubcat === 'all' || post.subcat === currentPostSubcat));
            const byDateDesc = (a, b) => String(b.date || '').localeCompare(String(a.date || ''));
            const articles = searched.filter(post => post.subcat === 'article').sort(byDateDesc);
            const dynamics = searched.filter(post => post.subcat === 'dynamic').sort(byDateDesc);
            // 帖子集合、分类或随机种子变化时才重新编排，保证“加载更多”前后的顺序稳定
            const signature = `${overviewFeedSeed}|${currentPostSubcat}|${searched.map(post => post.id).join(',')}`;
            if (!overviewFeedPlan || overviewFeedPlan.signature !== signature) {
                overviewFeedPlan = buildOverviewFeedPlan(articles, dynamics, signature);
                overviewFeedVisibleBlocks = MIXED_FEED_INITIAL_BLOCKS;
                overviewFeedRenderedBlocks = 0;
                // 内容集合（搜索 / 换一批 / 切换分类 / 新发布）变化时，取消上一次尚未执行的触底加载
                window.clearTimeout(overviewFeedAutoLoadTimer);
                overviewFeedLoading = false;
            }
            // 分类按钮与换一批现在是悬浮按钮（静态节点），这里只同步下拉选项与状态
            renderOverviewFilterMenu();
            if (!overviewFeedPlan.total) {
                container.innerHTML = '<div class="empty-state"><span class="icon">🗂️</span><p>这里还没有内容，换个分类或关键词试试。</p></div>';
                return;
            }
            const visibleBlocks = Math.min(overviewFeedVisibleBlocks, overviewFeedPlan.blocks.length);
            let shown = 0;
            let blockIndex = 0;
            let html = '';
            for (const block of overviewFeedPlan.blocks) {
                if (blockIndex >= visibleBlocks) break;
                shown += block.items.length;
                html += renderFeedBlock(block, block.items, blockIndex >= overviewFeedRenderedBlocks ? 'is-new' : '');
                blockIndex += 1;
            }
            const remaining = overviewFeedPlan.total - shown;
            container.innerHTML = `
                ${html}
                ${remaining > 0
                    ? `<div class="feed-autoload" id="overviewFeedLoader"><span class="feed-spinner" aria-hidden="true"></span>正在加载更多内容…</div>
                       <div class="feed-sentinel" id="overviewFeedSentinel" aria-hidden="true"></div>`
                    : `<div class="feed-footer"><span class="feed-end">我可是有底线的</span></div>`}`;
            overviewFeedRenderedBlocks = blockIndex;
            applyOutlineThumbIcons();
            observeOverviewFeedSentinel();
        }

        // ==================== 触底自动加载（无限下拉） ====================
        const MIXED_FEED_AUTOLOAD_DELAY = 260;   // 触底后稍作停顿再加载，避免瞬间全部展开
        const MIXED_FEED_AUTOLOAD_MARGIN = 240;  // 距底部多少像素开始预加载

        let overviewFeedObserver = null;
        let overviewFeedAutoLoadTimer = null;
        let overviewFeedLoading = false;

        function observeOverviewFeedSentinel() {
            const sentinel = document.getElementById('overviewFeedSentinel');
            if (overviewFeedObserver) { overviewFeedObserver.disconnect(); overviewFeedObserver = null; }
            if (!sentinel) { overviewFeedLoading = false; return; }
            if (!('IntersectionObserver' in window)) return;
            overviewFeedObserver = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) { if (entry.isIntersecting) scheduleOverviewFeedAutoLoad(); });
            }, { rootMargin: `0px 0px ${MIXED_FEED_AUTOLOAD_MARGIN}px 0px` });
            overviewFeedObserver.observe(sentinel);
        }

        function overviewFeedHasMore() {
            return Boolean(overviewFeedPlan) && overviewFeedVisibleBlocks < overviewFeedPlan.blocks.length;
        }

        function scheduleOverviewFeedAutoLoad() {
            if (overviewFeedLoading || !overviewFeedHasMore()) return;
            overviewFeedLoading = true;
            const loader = document.getElementById('overviewFeedLoader');
            if (loader) loader.classList.add('is-loading');
            window.clearTimeout(overviewFeedAutoLoadTimer);
            overviewFeedAutoLoadTimer = window.setTimeout(function () {
                overviewFeedLoading = false;
                if (overviewFeedHasMore()) loadMoreOverviewFeed();
            }, MIXED_FEED_AUTOLOAD_DELAY);
        }

        function reshuffleOverviewFeed() {
            overviewFeedSeed = Math.floor(Math.random() * 1e9);
            overviewFeedPlan = null;
            overviewFeedVisibleBlocks = MIXED_FEED_INITIAL_BLOCKS;
            overviewFeedRenderedBlocks = 0;
            renderOverviewFeed();
        }

        function loadMoreOverviewFeed() {
            overviewFeedVisibleBlocks += MIXED_FEED_STEP_BLOCKS;
            renderOverviewFeed();
        }

        function renderLiteratureSidebar(activeCategory = 'all') {
            const menu = document.getElementById('litFilterMenu');
            if (!menu) return;
            const categories = literatureCategories;
            const counts = {};
            categories.forEach(cat => {
                counts[cat.value] = literatureData.filter(d => d.category === cat.value).length;
            });
            const total = literatureData.length;
            let html = `<button class="lit-cat-btn ${activeCategory === 'all' ? 'active' : ''}" data-cat="all" onclick="filterLiterature('all', this)">全部文献 <span class="cat-count">${total}</span></button>`;
            categories.forEach(cat => {
                const count = counts[cat.value] || 0;
                html += `<button class="lit-cat-btn ${activeCategory === cat.value ? 'active' : ''}" data-cat="${cat.value}" onclick="filterLiterature('${cat.value}', this)">${cat.label} <span class="cat-count">${count}</span></button>`;
            });
            menu.innerHTML = html;
        }

        async function renderLiterature() {
            await loadLiteratureCategories();
            renderLiteratureSidebar(currentLitCategory);
            filterLiterature(currentLitCategory, null);
        }

        function filterLiterature(category, btn) {
            currentLitCategory = category;
            document.querySelectorAll('.lit-cat-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.cat === category);
            });
            const filtered = category === 'all' 
                ? literatureData 
                : literatureData.filter(d => d.category === category);
            const finalFiltered = filtered.filter(item => matchesSearchTitle(item.title));
            const container = document.getElementById('litList');
            if (finalFiltered.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>该分类下暂无文献</p></div>';
                return;
            }
            container.innerHTML = finalFiltered.map(item => {
                const categoryLabel = (literatureCategories.find(c => c.value === item.category) || {}).label || item.categoryLabel || item.category;
                return `
                <div class="lit-item">
                    <div class="lit-item-header">
                        <span class="badge badge-cyan">${categoryLabel}</span>
                        <span class="lit-item-title">${item.title}</span>
                    </div>
                    <div class="lit-item-authors">${item.authors}</div>
                    <div class="lit-item-journal">${item.journal}</div>
                    <div class="lit-item-excerpt" id="excerpt-${item.id}">
                        ${item.excerpt}
                        <span class="excerpt-toggle" onclick="toggleExcerpt(${item.id}, event)">展开全部 ▾</span>
                    </div>
                    <div class="lit-item-thumb">
                        ${item.screenshot ? `<img src="${item.screenshot}" alt="${item.title}文章截图">` : `<div class="thumb-placeholder">
                            <span class="icon"></span>
                            <span>${item.thumbDesc}</span>
                            <span style="font-size:0.7rem; color:var(--text-muted);">（截图占位）</span>
                        </div>`}
                    </div>
                    <div class="lit-item-footer">
                        <a href="${item.doi}" target="_blank" class="btn btn-sm btn-outline" onclick="recordLiteratureView(${item.id})">DOI: ${item.doi}</a>
                        <a href="${item.cnki}" target="_blank" class="btn btn-sm btn-outline" onclick="recordLiteratureView(${item.id})">知网</a>
                        ${hasPermission('admin') ? `<button class="btn btn-sm btn-outline" onclick="deleteLiterature(${item.id}); event.stopPropagation();">删除</button>` : ''}
                    </div>
                </div>
                `;
            }).join('');
        }

        function toggleExcerpt(id, event) {
            event.stopPropagation();
            const el = document.getElementById('excerpt-'+id);
            if(el) {
                el.classList.toggle('expanded');
                const toggle = el.querySelector('.excerpt-toggle');
                toggle.textContent = el.classList.contains('expanded') ? '收起 ▴' : '展开全部 ▾';
            }
        }

        // ==================== 信息流卡片渲染（文章=百度资讯风，动态=小红书风） ====================
        function getPostImages(post) {
            if (Array.isArray(post.images) && post.images.length) return post.images.filter(Boolean);
            const content = String(post.content || '');
            return [...content.matchAll(/<img[^>]+src=["']([^"']+)["']/gi)].map(match => match[1]);
        }

        function renderCardStats(post) {
            return `
                        <button class="${isPostLiked(post) ? 'active' : ''}" aria-label="点赞" onclick="togglePostLike(${post.id}, event)"><svg class="thumb-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M1 21h4V9H1v12zM23 10c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>${post.likes || 0}</button>
                        <button aria-label="评论" onclick="commentPost(${post.id}, event)"><svg class="comment-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h4v4l4-4h8c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>${(post.comments || []).length}</button>
                        <button class="${isPostFavorited(post) ? 'active' : ''}" aria-label="收藏" onclick="togglePostFavorite(${post.id}, event)"><svg class="favorite-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>${post.favorites || 0}</button>`;
        }

        function renderArticleCard(post) {
            const deleteBtn = hasPermission('own-post', post) ? `<button class="stat-delete" aria-label="删除" onclick="deletePost(${post.id}, event)">删除</button>` : '';
            const images = getPostImages(post);
            // 模式一：有自定义封面，或无封面但插图不足三张（以正文首图充当左侧封面）
            if (post.cover || (images.length > 0 && images.length < 3)) {
                const coverSrc = post.cover || images[0];
                return `
                <article class="post-item article-card" tabindex="0" role="link" aria-label="阅读文章：${post.title}" onclick="viewPost(${post.id})">
                    <div class="article-card-cover"><img src="${coverSrc}" alt="${post.title}封面" loading="lazy"></div>
                    <div class="article-card-body">
                        <h3 class="article-card-title">${post.title}</h3>
                        <div class="article-card-meta"><span class="author" onclick="openAuthorProfile('${post.author}'); event.stopPropagation();">${post.author}</span><span>发布于 ${post.date}</span></div>
                        <div class="article-card-stats">${renderCardStats(post)}${deleteBtn}</div>
                    </div>
                </article>`;
            }
            // 模式二：无封面且插图不少于三张，按帖子固定种子取三张展示在卡片中部（避免重复渲染时图片跳动）
            if (images.length >= 3) {
                const picked = shuffleWithRandom(images, createSeededRandom(Number(post.id) || 1));
                const middle = `<div class="article-card-media">${picked.slice(0, 3).map(src => `<div class="media-slot"><img src="${src}" alt="${post.title}插图" loading="lazy"></div>`).join('')}</div>`;
                return `
                <article class="post-item article-card plain" tabindex="0" role="link" aria-label="阅读文章：${post.title}" onclick="viewPost(${post.id})">
                    <h3 class="article-card-title">${post.title}</h3>
                    ${middle}
                    <div class="article-card-footer">
                        <span class="author" onclick="openAuthorProfile('${post.author}'); event.stopPropagation();">${post.author}</span>
                        <div class="article-card-stats">${renderCardStats(post)}${deleteBtn}</div>
                        <span class="card-date">发布于 ${post.date}</span>
                    </div>
                </article>`;
            }
            // 模式三：无封面且无插图，纯文字卡片
            return `
                <article class="post-item article-card plain" tabindex="0" role="link" aria-label="阅读文章：${post.title}" onclick="viewPost(${post.id})">
                    <h3 class="article-card-title">${post.title}</h3>
                    <p class="article-card-plain-excerpt">${post.excerpt || ''}</p>
                    <div class="article-card-footer">
                        <span class="author" onclick="openAuthorProfile('${post.author}'); event.stopPropagation();">${post.author}</span>
                        <div class="article-card-stats">${renderCardStats(post)}${deleteBtn}</div>
                        <span class="card-date">发布于 ${post.date}</span>
                    </div>
                </article>`;
        }

        function renderDynamicCard(post) {
            const images = getPostImages(post);
            const cover = images.length
                ? `<img src="${images[0]}" alt="${post.title}配图" loading="lazy">`
                : `<div class="dynamic-cover-placeholder"><span class="icon">🌪️</span><span>纯文字动态</span></div>`;
            const avatar = post.authorAvatar ? `<img src="${post.authorAvatar}" alt="${post.author}头像">` : (post.author || '匿').slice(0, 1).toUpperCase();
            const deleteBtn = hasPermission('own-post', post) ? `<button class="dynamic-card-delete" aria-label="删除" onclick="deletePost(${post.id}, event)">删除</button>` : '';
            return `
                <article class="post-item dynamic-card" tabindex="0" role="link" aria-label="查看动态：${post.title}" onclick="viewPost(${post.id})">
                    <div class="dynamic-card-cover">${cover}</div>
                    <h3 class="dynamic-card-title">${post.title}</h3>
                    <div class="dynamic-card-footer">
                        <span class="dynamic-card-author" onclick="openAuthorProfile('${post.author}'); event.stopPropagation();"><span class="mini-avatar">${avatar}</span><span class="name">${post.author}</span></span>
                        <span class="dynamic-card-actions">${deleteBtn}<button class="dynamic-card-like ${isPostLiked(post) ? 'active' : ''}" aria-label="点赞" onclick="togglePostLike(${post.id}, event)"><svg class="thumb-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M1 21h4V9H1v12z"/></svg>${post.likes || 0}</button></span>
                    </div>
                </article>`;
        }

        function viewPost(id) {
            const post = postsData.find(p=>p.id===id);
            if(!post) return;
            recordHistory({ kind:'post', id: post.id, title: post.title, subcat: post.subcat });
            currentPostDetailId = id;
            navigateTo('post-detail');
        }

        function renderPostDetail(id) {

        async function submitPostComment(event, id) {
            event.preventDefault();
            if (!requirePermission('user')) return;
            const content = new FormData(event.target).get('content').trim();
            if (!content) return;
            try {
                await apiRequest(postEndpoint(API_CONFIG.endpoints.postComments, id), { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ content }) });
                const post = postsData.find(item => item.id === id);
                if (post) { post.comments = post.comments || []; post.comments.push({ author:currentUser.name || currentUser.username, content, likes:0 }); }
                renderPostDetail(id);
            } catch (error) { alert(error.message); }
        }

        async function toggleCommentLike(postId, commentId, commentIndex) {
            if (!requirePermission('user')) return;
            const post = postsData.find(item => item.id === postId);
            const comment = post && post.comments && post.comments[commentIndex];
            if (!comment) return;
            if (API_CONFIG.enabled && !commentId) { alert('该评论缺少唯一标识，暂时无法点赞。'); return; }
            const liked = Boolean(comment.liked);
            try {
                await apiRequest(endpoint(API_CONFIG.endpoints.commentLike, { postId, commentId }), { method: liked ? 'DELETE' : 'POST' });
            } catch (error) { alert(error.message); return; }
            comment.liked = !liked;
            comment.likes = Math.max(0, (comment.likes || 0) + (liked ? -1 : 1));
            renderPostDetail(postId);
        }

        async function replyToComment(postId, commentIndex) {
            if (!requirePermission('user')) return;
            const post = postsData.find(item => item.id === postId);
            const parent = post && post.comments && post.comments[commentIndex];
            if (!parent) return;
            const content = prompt(`回复 ${parent.author || '用户'}：`);
            if (!content || !content.trim()) return;
            try {
                await apiRequest(postEndpoint(API_CONFIG.endpoints.postComments, postId), { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ content:`回复 ${parent.author || '用户'}：${content.trim()}` }) });
                post.comments.push({ author:currentUser.name || currentUser.username, content:`回复 ${parent.author || '用户'}：${content.trim()}`, likes:0 });
                renderPostDetail(postId);
            } catch (error) { alert(error.message); }

        async function downloadDataset(id) {
            const dataset = datasetsData.find(item => item.id === id);
            if (!dataset) return;
            recordHistory({ kind:'dataset', id: dataset.id, title: dataset.name });
            if (!API_CONFIG.enabled) {
                if (dataset.link && dataset.link !== '#') { window.open(dataset.link, '_blank'); return; }
                alert('演示模式未配置可下载文件；启用后端后将从下载接口获取文件。');
                return;
            }
            try {
                const response = await fetch(API_CONFIG.baseUrl + postEndpoint(API_CONFIG.endpoints.datasetDownload, id), { headers: { Authorization: 'Bearer ' + (localStorage.getItem('weatherPlatformToken') || '') } });
                if (!response.ok) throw new Error('数据集下载失败：' + response.status);
                const blob = await response.blob();
                const disposition = response.headers.get('Content-Disposition') || '';
                const matchedName = disposition.match(/filename\*?=(?:UTF-8''|\")?([^;\"]+)/i);
                const filename = matchedName ? decodeURIComponent(matchedName[1]) : (dataset.filename || dataset.name || 'dataset');
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                link.remove();
                URL.revokeObjectURL(url);
            } catch (error) { alert(error.message); }
        }

                html += `<div class="search-group"><div class="feed-section-title">数据集</div>${dss.map(d => `<div class="search-item" onclick="openDatasetCenter()"><span class="badge badge-teal">数据集</span><span class="search-item-title">${d.name}</span><span class="search-item-meta">${d.region || ''}</span></div>`).join('')}</div>`;
            }
            container.innerHTML = html || '<div class="empty-state"><p>没有找到相关内容</p></div>';
        }

        function openDatasetCenter() {
            navigateTo('media');
            switchMediaTab('datacenter', document.querySelector('.media-subnav-btn[data-msub=datacenter]'));
        }

        // ==================== 初始化 ====================
        function init() {
            const hash = location.hash.replace('#','');
            if(hash==='tools') {
                navigateTo('tools');
            } else {
                navigateTo('media');
            }
            // 预渲染概览
            renderOverview();
            updateAccountUI();
            restoreSession();
            loadLiteratureCategories();
            loadBackendContent();
            initBackToTop();
        }
        init();
    </script>
</body>
</html>
